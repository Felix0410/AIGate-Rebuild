services:

  # 1、启动独立测试 MySQL，使用临时数据目录，不发布数据库端口。
  mysql:
    image: aigate-mysql-ci:p1
    build:
      context: ..
      dockerfile: infra/mysql.Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: core_db
      AIGATE_DB_PASSWORD: ${AIGATE_DB_PASSWORD:?required}
      AIGATE_FLYWAY_PASSWORD: ${AIGATE_FLYWAY_PASSWORD:?required}
      TZ: UTC
    tmpfs:
      - /var/lib/mysql
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -uroot -Nse 'SELECT 1' core_db >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 60

  # 2、使用迁移账号执行脚本，成功退出后再启动 Core。
  migrate:
    image: aigate-core:p1
    build:
      context: ..
      dockerfile: aigate-core/Dockerfile
    entrypoint: ["java", "-Dloader.main=com.felix.aigatecore.migration.MigrationApplication", "-cp", "/app/app.jar", "org.springframework.boot.loader.launch.PropertiesLauncher"]
    environment:
      AIGATE_DB_URL: jdbc:mysql://mysql:3306/core_db?connectionTimeZone=UTC
      AIGATE_FLYWAY_USERNAME: aigate_migrator
      AIGATE_FLYWAY_PASSWORD: ${AIGATE_FLYWAY_PASSWORD:?required}
    depends_on:
      mysql: {condition: service_healthy}
    networks: [private]

  # 3、Core 使用应用账号，关闭启动迁移，不注入迁移密码。
  core:
    image: aigate-core:p1
    build:
      context: ..
      dockerfile: aigate-core/Dockerfile
    environment:
      AIGATE_BIND_ADDRESS: 0.0.0.0
      AIGATE_DB_URL: jdbc:mysql://mysql:3306/core_db?connectionTimeZone=UTC&connectTimeout=3000&socketTimeout=3000
      AIGATE_DB_USERNAME: aigate_app
      AIGATE_DB_PASSWORD: ${AIGATE_DB_PASSWORD:?required}
      AIGATE_GOVERNANCE_AUDIT_HMAC_KEY_ID: gov-audit-v1
      AIGATE_GOVERNANCE_AUDIT_HMAC_KEY: ${AIGATE_GOVERNANCE_AUDIT_HMAC_KEY:?required}
      AIGATE_COMPANY_ZONE_ID: ${AIGATE_COMPANY_ZONE_ID:?required}
      AIGATE_FLYWAY_ENABLED: "false"
      AIGATE_SERVICE_TOKEN: ${AIGATE_SERVICE_TOKEN:?required}
      AIGATE_MANAGEMENT_PEPPER: ${AIGATE_MANAGEMENT_PEPPER:?required}
      AIGATE_AGENT_PEPPER_KEY_ID: agent-v1
      AIGATE_AGENT_PEPPER: ${AIGATE_AGENT_PEPPER:?required}
      AIGATE_EMPLOYEE_PEPPER_KEY_ID: employee-v1
      AIGATE_EMPLOYEE_PEPPER: ${AIGATE_EMPLOYEE_PEPPER:?required}
      AIGATE_PROVIDER_ENCRYPTION_KEY_ID: provider-enc-v1
      AIGATE_PROVIDER_ENCRYPTION_KEY: ${AIGATE_PROVIDER_ENCRYPTION_KEY:?required}
      AIGATE_PROVIDER_ISSUE_PEPPER_KEY_ID: provider-issue-v1
      AIGATE_PROVIDER_ISSUE_PEPPER: ${AIGATE_PROVIDER_ISSUE_PEPPER:?required}
      AIGATE_BOOTSTRAP_MODE: ${AIGATE_BOOTSTRAP_MODE:-OFF}
      AIGATE_BOOTSTRAP_TOKEN: ${AIGATE_BOOTSTRAP_TOKEN:-}
      AIGATE_BOOTSTRAP_ALLOWED_CIDRS: ${AIGATE_BOOTSTRAP_ALLOWED_CIDRS:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [private]

  # 4、Gateway 通过内网访问 Core，对外端口只绑定宿主机回环地址。
  gateway:
    image: aigate-gateway:p1
    build:
      context: ..
      dockerfile: aigate-gateway/Dockerfile
    environment:
      AIGATE_BIND_ADDRESS: 0.0.0.0
      AIGATE_CORE_URL: http://core:8081
      AIGATE_SERVICE_TOKEN: ${AIGATE_SERVICE_TOKEN:?required}
    ports: ["127.0.0.1:${AIGATE_CI_PORT:-18080}:8080"]
    depends_on: [core]
    networks: [public, private]
networks:
  private: {internal: true}
  public: {}
